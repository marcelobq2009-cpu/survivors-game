# A cada push na main: baixa o Godot, roda os testes GUT e, se passarem,
# exporta para web e publica no GitHub Pages.
name: Testar e publicar (web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# So um deploy por vez; um push novo cancela o anterior.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache do Godot + templates web
        uses: actions/cache@v6
        with:
          path: tools/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-web

      - name: Instalar Godot
        run: ./scripts/setup-godot.sh --with-templates

      - name: Testes (GUT)
        run: ./scripts/test.sh

      - name: Exportar para web
        run: ./scripts/build-web.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
